      - name: Generate iOS project
        shell: bash
        run: |
          cd "$RUNNER_TEMP/FocusBrowser"
          xcodegen generate
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/FocusBrowser"
          xcodebuild -project FocusBrowser.xcodeproj -scheme FocusBrowser -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          test -d build/Build/Products/Release-iphoneos/FocusBrowser.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FocusBrowser.app Payload/
          zip -qry FocusBrowser-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FocusBrowser-unsigned-IPA
          path: ${{ runner.temp }}/FocusBrowser/FocusBrowser-unsigned.ipa
          if-no-files-found: error
