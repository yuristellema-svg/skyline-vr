      - name: Package native Safari extension
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quietsearch-safari"
          if xcrun --find safari-web-extension-packager >/dev/null 2>&1; then
            TOOL=safari-web-extension-packager
          else
            TOOL=safari-web-extension-converter
          fi
          xcrun "$TOOL" "$PWD/webextension" --project-location "$PWD/native" --app-name QuietSearchSafari --bundle-identifier nl.yuristellema.quietsearchsafari --ios-only --swift --copy-resources --no-prompt --no-open
          find native -name "*.xcodeproj" -maxdepth 4 -print
      - name: Build unsigned iPhone app with embedded Safari extension
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quietsearch-safari"
          PROJECT="$(find native -name "*.xcodeproj" -print -quit)"
          test -n "$PROJECT"
          xcodebuild -list -json -project "$PROJECT" > schemes.json
          python3 - <<'PY'
          import json
          j=json.load(open('schemes.json'))
          schemes=j.get('project',{}).get('schemes',[]) or j.get('workspace',{}).get('schemes',[])
          print('Available schemes:',schemes)
          selected=next((x for x in schemes if ('iOS' in x or 'iPhone' in x) and 'Extension' not in x),None)
          if not selected: selected=next((x for x in schemes if 'Extension' not in x),None)
          if not selected: raise SystemExit('No containing iPhone-app scheme found')
          open('selected-scheme.txt','w').write(selected)
          PY
          SCHEME="$(cat selected-scheme.txt)"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$PWD/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$(find "$PWD/derived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" -print -quit)"
          test -n "$APP"
          test -d "$APP/PlugIns"
          APPEX="$(find "$APP/PlugIns" -mindepth 1 -maxdepth 1 -type d -name "*.appex" -print -quit)"
          test -n "$APPEX"
          EXTPOINT="$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APPEX/Info.plist")"
          echo "Extension point: $EXTPOINT"
          test "$EXTPOINT" = "com.apple.Safari.web-extension"
          test -n "$(find "$APPEX" -name manifest.json -print -quit)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qyr QuietSearchSafari-unsigned.ipa Payload
      - name: Downloadable iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuietSearchSafari-IPA
          path: ${{ runner.temp }}/quietsearch-safari/QuietSearchSafari-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
